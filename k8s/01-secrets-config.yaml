apiVersion: v1
kind: Secret
metadata:
  name: sbdt-secret
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: secret
  REPLICATOR_PASSWORD: rep_secret
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sbdt-config
data:
  POSTGRES_DB: appdb
  PRIMARY_DB_URL: "postgresql://postgres:secret@pg-primary-headless:5432/appdb"
  REPLICA_DB_URL: "postgresql://postgres:secret@pg-replica-headless:5432/appdb"
  KEYCLOAK_JWKS_URL: "http://keycloak-svc:8080/realms/sbdt-realm/protocol/openid-connect/certs"